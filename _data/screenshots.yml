# Screenshots page data (rendered by screenshots.pug).
#
# `src` is relative to /img/screenshots/; a downscaled copy for display lives at
# /img/screenshots/web/<src with / replaced by _>.webp, and the full PNG is linked.
#
# latest: regenerate with `scripts/screenshots.py` in ActivityWatch/activitywatch
# (demo data, isolated server), then move the previous `latest` shots into
# `evolution` so the history keeps growing.

latest:
  version: v0.14.0
  shots:
    - {title: Activity, src: v0.14.0/activity-day.png, dark: v0.14.0/activity-day-dark.png, note: One day across all your devices}
    - {title: Activity (year), src: v0.14.0/activity-year.png, dark: v0.14.0/activity-year-dark.png, note: "A whole year, back in under a second once cached"}
    - {title: Activity (week), src: v0.14.0/activity-week.png, dark: v0.14.0/activity-week-dark.png}
    - {title: Activity (month), src: v0.14.0/activity-month.png, dark: v0.14.0/activity-month-dark.png}
    - {title: Browser activity, src: v0.14.0/activity-browser.png, dark: v0.14.0/activity-browser-dark.png}
    - {title: Timeline, src: v0.14.0/timeline.png, dark: v0.14.0/timeline-dark.png, note: Every device on one timeline}
    - {title: Search, src: v0.14.0/search.png, dark: v0.14.0/search-dark.png}
    - {title: Query explorer, src: v0.14.0/query.png, dark: v0.14.0/query-dark.png}
    - {title: Stopwatch, src: v0.14.0/stopwatch.png, dark: v0.14.0/stopwatch-dark.png}
    - {title: Categorization, src: v0.14.0/categorization.png, dark: v0.14.0/categorization-dark.png, note: Rules that sort your time into categories}
    - {title: Settings, src: v0.14.0/settings.png, dark: v0.14.0/settings-dark.png}
    - {title: Buckets, src: v0.14.0/buckets.png, dark: v0.14.0/buckets-dark.png, note: Raw data from each watcher and device}

  # Android app (aw-android v0.14.2), shown as a row of phone screens.
  android_version: v0.14.2
  android:
    - {title: Today, src: v0.14.0/android/activity-day.png, dark: v0.14.0/android/activity-day-dark.png}
    - {title: Last 30 days, src: v0.14.0/android/activity-30d-categories.png, dark: v0.14.0/android/activity-30d-categories-dark.png}
    - {title: Week, src: v0.14.0/android/activity-week.png}
    - {title: Categories, src: v0.14.0/android/activity-day-sunburst.png}
    - {title: Timeline, src: v0.14.0/android/timeline.png}

# One entry per view, oldest first. Each shot is that view as it looked in a version.
evolution:
  - view: Activity
    shots:
      - version: v0.8.0dev
        year: 2018
        src: screenshot-v0.8.0dev-activity.png
      - version: v0.8.0b9
        year: 2019
        src: screenshot-v0.8.0b9-today.png
        note: The “Today” view, before it became Activity
      - version: v0.9.3
        year: 2020
        src: screenshot-v0.9.3-activity.png
      - version: v0.12.0b2
        year: 2022
        src: BelKed/screenshot-v0.12.0b2-activity.png
        by: BelKed
        note: Dark mode
      - version: v0.12
        year: 2023
        src: realhyperchango/activity-productivity.png
        by: realhyperchango
        note: Productivity categories
      - version: v0.14.0b8
        year: 2026
        src: screenshot-v0.14.0b8-aw-tauri-activity.png
        note: The new Tauri app
      - version: v0.14.0
        year: 2026
        src: v0.14.0/activity-day.png
        note: Multi-device, with demo data
  - view: Timeline
    shots:
      - version: v0.8.0b9
        year: 2019
        src: screenshot-v0.8.0b9-timeline.png
      - version: v0.12
        year: 2023
        src: thelifeimliving/timeline-dark.png
        by: thelifeimliving
        note: Dark mode
      - version: v0.14.0
        year: 2026
        src: v0.14.0/timeline.png
        note: Multi-device, with demo data

