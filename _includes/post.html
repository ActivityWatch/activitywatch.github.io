<article class="post blog-post" itemscope itemtype="http://schema.org/BlogPosting">
    <header class="post-header">
        <h1 class="post-title" itemprop="headline">{{ page.title }}</h1>

        <div class="post-meta">
            {% if page.author %}<span itemprop="author" itemscope itemtype="http://schema.org/Person"><span itemprop="name">{{ page.author }}</span></span>
            <span class="meta-sep" aria-hidden="true">&middot;</span>{% endif %}
            <time datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">{{ page.date | date: "%B %-d, %Y" }}</time>
        </div>
    </header>

    {% if page.toc %}
    <details class="toc">
        <summary>Table of contents</summary>
        {{ include.content | toc_only }}
    </details>
    {% endif %}

    <div class="post-content" itemprop="articleBody">
        {{ include.content | inject_anchors }}
    </div>
</article>
